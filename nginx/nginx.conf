# Nginx load balancer konfiguratsiyasi — ikkala server uchun
#
# O'rnatish va ishlatish:
#   apt install nginx
#   cp nginx/nginx.conf /etc/nginx/sites-available/akbel
#   ln -s /etc/nginx/sites-available/akbel /etc/nginx/sites-enabled/akbel
#   nginx -t && systemctl reload nginx
#
# SERVER1_IP va SERVER2_IP o'rniga haqiqiy IP manzillarni yozing.

upstream akbel_backend {
    # ip_hash: bir xil foydalanuvchi har doim bir serverga ketadi (session uchun muhim)
    ip_hash;

    server SERVER1_IP:3000;
    server SERVER2_IP:3000;
}

server {
    listen 80;
    server_name akbelim.com www.akbelim.com;

    # HTTPS ga yo'naltirish (SSL sozlangandan keyin ochib qo'ying)
    # return 301 https://$host$request_uri;

    client_max_body_size 6m;

    location / {
        proxy_pass         http://akbel_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

